<!--

CSS ==> Cascading Style Sheets 
Type of CSS:
01. Inline CSS
==> Apply into the tags in body tag
Example:
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline CSS</title>
</head>
<body>
    <h1 style="color: blue;">This is blue heading.</h1>
</body>
</html>

02. Internal CSS
==> Apply into the head tag
Example:
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Internal CSS</title>
    <style>
        h1 {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>This is blue heading.</h1>
</body>
</html>

03. External CSS
==> Apply different file
Example:
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Internal CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>This is blue heading.</h1>
</body>
</html>

In style.css file code:
h1 {
    color: red;
}


-->
